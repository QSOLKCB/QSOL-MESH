name: Contracts and Rust skeleton

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-contracts.py
      - name: Validate retained Phase 1 CUDA-host evidence
        run: python3 scripts/validate-retained-phase1-evidence.py
      - name: Validate retained GALAXY CPU parity evidence
        run: python3 scripts/validate-retained-galaxy-cpu-evidence.py
      - name: Validate CUDA build script syntax
        run: bash -n scripts/build-cuda-helper.sh scripts/build-cuda-stream-helper.sh scripts/capture-phase3-cuda-stream.sh
      - name: Verify selected CUDA compiler provenance
        run: python3 scripts/test-phase3-compiler-capture.py
      - name: Validate JSON syntax independently
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("machine").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

  release-preflight:
    if: ${{ (github.event_name == 'pull_request' && github.head_ref == 'release/v0.1.0-prep') || (github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate v0.1.0 release candidate
        run: python3 scripts/release-preflight.py

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: CLI smoke
        run: |
          cargo run -q -p qsol-mesh-cli --locked -- inspect --json | grep -q '"available_parallelism":'
          cargo run -q -p qsol-mesh-cli --locked -- run smoke --items 1000 --workers 4 --json > /tmp/mesh-smoke.json
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-cuda --items 1000 --device 0 --json > /tmp/mesh-cuda-stdout 2> /tmp/mesh-cuda-stderr; then
            echo "missing canonical CUDA worker unexpectedly produced successful execution" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-cuda-stdout
          grep -q 'CUDA helper launch failed' /tmp/mesh-cuda-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- verify smoke-stream --items 1000 --chunk-items 200 --pinned-limit-bytes 1608 --accelerator-limit-bytes 1608 --json > /tmp/mesh-stream-stdout 2> /tmp/mesh-stream-stderr; then
            echo "missing canonical CUDA stream worker unexpectedly produced execution evidence" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-stream-stdout
          grep -q 'CUDA stream helper launch failed' /tmp/mesh-stream-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-stream --items 1000 --json > /tmp/mesh-stream-run-stdout 2> /tmp/mesh-stream-run-stderr; then
            echo "undeclared run smoke-stream activation was accepted" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-stream-run-stdout
          grep -q 'smoke-stream is admitted only by verify' /tmp/mesh-stream-run-stderr
          cat > /tmp/mesh-cuda-forged-helper <<'SH'
          #!/usr/bin/env bash
          printf 'qsol.mesh.cuda-smoke-worker.v1\titems=1000\tchecksum=d3886842145b489c\tblocks=1\tthreads_per_block=256\tdevice=0\tcompute_major=12\tcompute_minor=0\tcuda_runtime=13020\tcuda_driver=13020\n'
          SH
          chmod +x /tmp/mesh-cuda-forged-helper
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-cuda --items 1000 --device 0 --helper /tmp/mesh-cuda-forged-helper --json > /tmp/mesh-cuda-forged-stdout 2> /tmp/mesh-cuda-forged-stderr; then
            echo "caller-selected forged CUDA helper unexpectedly produced successful execution" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-cuda-forged-stdout
          grep -q 'helper overrides are not admitted' /tmp/mesh-cuda-forged-stderr
          if QSOL_MESH_CUDA_HELPER=/tmp/mesh-cuda-forged-helper cargo run -q -p qsol-mesh-cli --locked -- run smoke-cuda --items 1000 --device 0 --json > /tmp/mesh-cuda-env-stdout 2> /tmp/mesh-cuda-env-stderr; then
            echo "environment-selected forged CUDA helper unexpectedly produced successful execution" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-cuda-env-stdout
          grep -q 'CUDA helper launch failed' /tmp/mesh-cuda-env-stderr
          rm -f /tmp/mesh-cuda-cwd-forged-executed
          mkdir -p /tmp/repro/target
          cat > /tmp/repro/target/mesh-cuda-smoke <<'SH'
          #!/usr/bin/env bash
          touch /tmp/mesh-cuda-cwd-forged-executed
          printf 'qsol.mesh.cuda-smoke-worker.v1\titems=1000\tchecksum=d3886842145b489c\tblocks=1\tthreads_per_block=256\tdevice=0\tcompute_major=12\tcompute_minor=0\tcuda_runtime=13020\tcuda_driver=13020\n'
          SH
          chmod +x /tmp/repro/target/mesh-cuda-smoke
          (
            cd /tmp/repro
            if "$GITHUB_WORKSPACE/target/debug/mesh" run smoke-cuda --items 1000 --device 0 --json > /tmp/mesh-cuda-cwd-stdout 2> /tmp/mesh-cuda-cwd-stderr; then
              echo "caller-CWD CUDA helper unexpectedly produced successful execution" >&2
              exit 1
            fi
          )
          test ! -e /tmp/mesh-cuda-cwd-forged-executed
          test ! -s /tmp/mesh-cuda-cwd-stdout
          grep -q 'CUDA helper launch failed' /tmp/mesh-cuda-cwd-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-static --items 1000 --cpu-items 400 --cpu-workers 2 --device 0 --json > /tmp/mesh-static-stdout 2> /tmp/mesh-static-stderr; then
            echo "static CPU/CUDA split unexpectedly succeeded without canonical CUDA worker" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-static-stdout
          grep -q 'CUDA range helper launch failed' /tmp/mesh-static-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-static --items 1000 --cpu-workers 2 --device 0 --json > /tmp/mesh-static-missing-split-stdout 2> /tmp/mesh-static-missing-split-stderr; then
            echo "static CPU/CUDA split unexpectedly accepted missing --cpu-items" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-static-missing-split-stdout
          grep -q -- '--cpu-items is required for a fixed static split' /tmp/mesh-static-missing-split-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-concurrent --items 1000 --cpu-items 400 --cpu-workers 2 --device 0 --json > /tmp/mesh-concurrent-stdout 2> /tmp/mesh-concurrent-stderr; then
            echo "concurrent CPU/CUDA split unexpectedly succeeded without canonical CUDA worker" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-concurrent-stdout
          grep -q 'CUDA range helper launch failed' /tmp/mesh-concurrent-stderr
          if cargo run -q -p qsol-mesh-cli --locked -- run smoke-concurrent --items 1000 --cpu-workers 2 --device 0 --json > /tmp/mesh-concurrent-missing-split-stdout 2> /tmp/mesh-concurrent-missing-split-stderr; then
            echo "concurrent CPU/CUDA split unexpectedly accepted missing --cpu-items" >&2
            exit 1
          fi
          test ! -s /tmp/mesh-concurrent-missing-split-stdout
          grep -q -- '--cpu-items is required for a fixed static split' /tmp/mesh-concurrent-missing-split-stderr
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("/tmp/mesh-smoke.json").read_text())
          evidence = json.loads(Path("machine/evidence-contract.v1.json").read_text())
          workload = json.loads(Path("machine/workloads/smoke-v1.json").read_text())
          missing = set(evidence["receipt_required_sections"]) - set(receipt)
          if missing:
              raise SystemExit(f"smoke receipt missing sections: {sorted(missing)}")
          if receipt["claim_boundary"] != workload["claim_boundary"]:
              raise SystemExit("smoke receipt claim boundary drift")
          if receipt["verification"] != {
              "kind": "scalar-reference-equality",
              "checksum": "d3886842145b489c",
              "reference": "d3886842145b489c",
              "verified": True,
          }:
              raise SystemExit("smoke receipt verification drift")
          PY
          cargo run -q -p qsol-mesh-cli --locked -- plan memory --total-bytes 1000 --chunk-bytes 400 --pinned-limit-bytes 256 --accelerator-limit-bytes 300 --partial-bytes 24 --json > /tmp/mesh-memory-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("/tmp/mesh-memory-plan.json").read_text())
          evidence = json.loads(Path("machine/evidence-contract.v1.json").read_text())
          contract = json.loads(Path("machine/memory-plan-contract.v1.json").read_text())
          missing = set(evidence["receipt_required_sections"]) - set(receipt)
          if missing:
              raise SystemExit(f"memory plan receipt missing sections: {sorted(missing)}")
          if receipt["schema"] != contract["receipt_contract"]["schema"]:
              raise SystemExit("memory plan receipt schema drift")
          if receipt["requested_configuration"] != {
              "total_bytes": 1000,
              "requested_chunk_bytes": 400,
              "host_pinned_limit_bytes": 256,
              "accelerator_limit_bytes": 300,
              "partial_bytes": 24,
          }:
              raise SystemExit("memory plan requested configuration drift")
          plan = receipt["memory_plan"]
          if plan["effective_chunk_bytes"] != 256 or plan["chunk_count"] != 4:
              raise SystemExit("memory plan chunk geometry drift")
          if plan["peak_live_bytes"]["host-pinned"] != 256:
              raise SystemExit("memory plan pinned peak drift")
          if plan["peak_live_bytes"]["accelerator-local"] != 256:
              raise SystemExit("memory plan accelerator peak drift")
          if plan["physically_materialized"] is not False:
              raise SystemExit("memory plan falsely claims physical materialization")
          if receipt["effective_execution"] != {
              "kind": "planning-only",
              "executor": "none",
              "physically_materialized": False,
          }:
              raise SystemExit("memory plan effective execution boundary drift")
          if receipt["verification"] != {
              "kind": "structural-memory-plan-validation",
              "verified": True,
          }:
              raise SystemExit("memory plan structural verification drift")
          if receipt["claim_boundary"] != "planning-only-not-physical-allocation-evidence":
              raise SystemExit("memory plan claim boundary drift")
          PY
          cargo run -q -p qsol-mesh-cli --locked -- calibrate smoke --calibration-items 1000 --full-items 2000 --repeats 1 --near-tie-bps 500 --json > /tmp/mesh-calibrated-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("/tmp/mesh-calibrated-plan.json").read_text())
          evidence = json.loads(Path("machine/evidence-contract.v1.json").read_text())
          contract = json.loads(Path("machine/calibrated-plan-contract.v1.json").read_text())
          missing = set(evidence["receipt_required_sections"]) - set(receipt)
          if missing:
              raise SystemExit(f"calibrated plan receipt missing sections: {sorted(missing)}")
          if receipt["schema"] != contract["receipt_contract"]["schema"]:
              raise SystemExit("calibrated plan receipt schema drift")
          requested = receipt["requested_configuration"]
          if requested != {
              "calibration_items": 1000,
              "full_work_items": 2000,
              "repeats": 1,
              "near_tie_bps": 500,
          }:
              raise SystemExit("calibrated plan requested configuration drift")
          if receipt["source_identity"]["plan_identity"] != contract["plan_identity"]:
              raise SystemExit("calibrated plan identity drift")
          if receipt["workload_identity"]["workload_id"] != contract["executed_workload_identity"]:
              raise SystemExit("calibrated workload identity drift")
          topology = receipt["observed_topology"]
          if topology["available_cpu_workers"] < 1:
              raise SystemExit("calibrated plan did not observe CPU capacity")
          if topology["accelerator_observed"] is not False:
              raise SystemExit("CPU smoke calibration invented accelerator observation")
          calibration = receipt["calibration"]
          if not (1 <= calibration["candidate_count"] <= contract["candidate_contract"]["maximum_candidates"]):
              raise SystemExit("calibrated plan candidate budget violation")
          candidates = calibration["candidates"]
          observations = calibration["observations"]
          if len(candidates) != calibration["candidate_count"]:
              raise SystemExit("calibrated candidate count mismatch")
          if len(observations) != len(candidates):
              raise SystemExit("not every calibration candidate was measured")
          canonical = [candidate for candidate in candidates if candidate["canonical"]]
          if len(canonical) != 1:
              raise SystemExit("calibrated plan must have exactly one canonical candidate")
          checksums = {observation["checksum"] for observation in observations}
          if len(checksums) != 1 or not all(observation["verified"] for observation in observations):
              raise SystemExit("calibration observations lost canonical parity")
          if any(observation["setup_ns"] != 0 or observation["transfer_ns"] != 0 for observation in observations):
              raise SystemExit("CPU smoke cost scope drift")
          candidate_by_id = {candidate["id"]: candidate for candidate in candidates}
          for observation in observations:
              candidate = candidate_by_id[observation["candidate_id"]]
              if not (1 <= observation["effective_cpu_workers"] <= candidate["cpu_workers"]):
                  raise SystemExit("calibrated effective CPU worker evidence drift")
              if observation["effective_cpu_workers"] > observation["work_units"]:
                  raise SystemExit("calibrated effective workers exceed measured work")
          confirmation = calibration["full_work_confirmation"]
          if not confirmation or not all(observation["verified"] for observation in confirmation):
              raise SystemExit("full-work confirmation missing or unverified")
          if len({observation["checksum"] for observation in confirmation}) != 1:
              raise SystemExit("full-work confirmation checksum divergence")
          if any(observation["setup_ns"] != 0 or observation["transfer_ns"] != 0 for observation in confirmation):
              raise SystemExit("full-work CPU cost scope drift")
          effective = receipt["effective_execution"]
          candidate_ids = {candidate["id"] for candidate in candidates}
          if effective["selected_candidate_id"] not in candidate_ids:
              raise SystemExit("selected candidate is outside candidate set")
          if effective["canonical_candidate_id"] != canonical[0]["id"]:
              raise SystemExit("canonical candidate identity drift")
          selected_candidate = candidate_by_id[effective["selected_candidate_id"]]
          selected_confirmation = next(
              observation for observation in confirmation
              if observation["candidate_id"] == effective["selected_candidate_id"]
          )
          if effective["selected_requested_cpu_workers"] != selected_candidate["cpu_workers"]:
              raise SystemExit("selected requested worker evidence drift")
          if effective["selected_effective_cpu_workers"] != selected_confirmation["effective_cpu_workers"]:
              raise SystemExit("selected effective worker evidence drift")
          if receipt["verification"] != {
              "kind": "canonical-checksum-equality-plus-full-work-confirmation",
              "verified": True,
          }:
              raise SystemExit("calibrated verification drift")
          if receipt["claim_boundary"] != "host-specific-measured-planning-not-universal-performance-evidence":
              raise SystemExit("calibrated plan claim boundary drift")
          PY
          for command in calibrate plan receipt; do
            cargo run -q -p qsol-mesh-cli --locked -- "$command" --json | grep -q '"status":"not-implemented"'
          done

  galaxy-cpu-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out merged GALAXY CPU range authority
        uses: actions/checkout@v4
        with:
          repository: QSOLKCB/GALAXY
          ref: 623c43a13c0696533164826ec71896488c7aed44
          path: galaxy-upstream
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
      - name: Build both runtimes
        run: |
          mv galaxy-upstream "$RUNNER_TEMP/galaxy-upstream"
          cargo build --release --locked -p qsol-mesh-cli
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/galaxy-upstream/cpu-runtime/Cargo.toml" --bin galaxy-cpu
      - name: Verify bounded and frozen partitioned parity
        run: |
          mkdir -p parity-receipts
          ./target/release/mesh verify galaxy-cpu --binary "$RUNNER_TEMP/galaxy-upstream/cpu-runtime/target/release/galaxy-cpu" --logical 4096 --resident 1024 --frames 2 --seed 303 --partitions 4 --json > parity-receipts/bounded.json
          ./target/release/mesh verify galaxy-cpu --binary "$RUNNER_TEMP/galaxy-upstream/cpu-runtime/target/release/galaxy-cpu" --partitions 2 --json > parity-receipts/frozen.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bounded = json.loads(Path("parity-receipts/bounded.json").read_text())
          frozen = json.loads(Path("parity-receipts/frozen.json").read_text())
          evidence = json.loads(Path("machine/evidence-contract.v1.json").read_text())
          contract = json.loads(Path("machine/galaxy-range-contract.v2.json").read_text())
          for receipt, partitions in [(bounded, 4), (frozen, 2)]:
              assert receipt["schema"] == contract["evidence_boundary"]["receipt_schema"]
              assert set(evidence["receipt_required_sections"]) <= set(receipt)
              assert receipt["observed_topology"] == {"status": "not-observed", "source": "external-galaxy-cpu-range-process"}
              assert receipt["memory_plan"] == {"status": "not-observed", "owner": "galaxy-cpu-runtime", "mesh_materializes_logical_population": False}
              assert receipt["calibration"] == {"performed": False, "placement_decision_influenced": False}
              assert receipt["verification"]["partitioned_parity"] is True
              assert receipt["verification"]["full_checksum"] == receipt["verification"]["partitioned_checksum"]
              assert receipt["effective_execution"]["partial_count"] == partitions
          assert frozen["requested_configuration"] == {
              "logical_population": 18446744073709551615,
              "resident_particles": 8388608,
              "frames": 8,
              "seed": 303,
              "partitions": 2,
          }
          assert frozen["verification"]["full_checksum"] == "8d6f07bd77e2fc16"
          assert frozen["verification"]["archived_oracle_verified"] is True
          assert bounded["verification"]["archived_oracle_verified"] is False
          for path in sorted(Path("parity-receipts").glob("*.json")):
              print(f"{path}: {hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - name: Retain MESH parity receipts
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-cpu-parity
          path: parity-receipts/*.json
          if-no-files-found: error
