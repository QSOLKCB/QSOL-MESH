name: Contracts and Rust skeleton

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate-contracts.py
      - name: Validate JSON syntax independently
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("machine").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

  release-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate v0.1.0 release candidate
        run: python3 scripts/release-preflight.py

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.85.1
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: CLI contract smoke
        run: |
          cargo run -q -p qsol-mesh-cli --locked -- inspect --json | tee /tmp/mesh-inspect.json
          grep -q '"status":"not-implemented"' /tmp/mesh-inspect.json
          for command in inspect calibrate plan run verify receipt; do
            cargo run -q -p qsol-mesh-cli --locked -- "$command" --json | grep -q "\"command\":\"$command\""
          done
